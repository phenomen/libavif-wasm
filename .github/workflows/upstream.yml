name: Upstream versions

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Compare pins to latest releases
        id: check
        run: node scripts/check-upstream.mjs
        continue-on-error: true

      - name: Open or refresh tracking issue
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream release available (libavif / dav1d / libaom)';
            const body = `${process.env.MARKDOWN}

            Pins are in \`versions.env\`. After bumping, rebuild in Docker and update README sizes.

            _Opened by the scheduled upstream-versions workflow._`;
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'upstream',
                color: '0e8a16',
                description: 'Newer libavif, dav1d, or libaom release',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream',
              per_page: 20,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream'],
              });
            }
        env:
          MARKDOWN: ${{ steps.check.outputs.updates_markdown }}

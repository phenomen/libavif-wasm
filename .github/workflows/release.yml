name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Emscripten version
        id: versions
        run: |
          set -a
          # shellcheck disable=SC1091
          source versions.env
          set +a
          echo "emsdk=${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build wasm image
        run: |
          docker build \
            --build-arg EMSDK_VERSION=${{ steps.versions.outputs.emsdk }} \
            -t libavif-wasm-builder .

      - name: Compile decode and encode modules
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -u "$(id -u):$(id -g)" \
            -e JOBS=4 \
            libavif-wasm-builder \
            ./scripts/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test in Node
        run: node --test test/node/*.test.mjs

      - name: Pack release zip
        run: |
          mkdir -p release
          cp -a dist LICENSE THIRD_PARTY_NOTICES.md licenses versions.env README.md release/
          (cd release && zip -r ../libavif-wasm-${{ github.ref_name }}.zip .)

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libavif-wasm-${{ github.ref_name }}.zip
            dist/decode.wasm
            dist/encode.wasm
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true

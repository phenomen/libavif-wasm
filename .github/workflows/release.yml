name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Emscripten version
        id: versions
        run: |
          set -a
          # shellcheck disable=SC1091
          source versions.env
          set +a
          echo "emsdk=${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build wasm image
        run: |
          docker build \
            --build-arg EMSDK_VERSION=${{ steps.versions.outputs.emsdk }} \
            -t libavif-wasm-builder .

      - name: Compile decode and encode modules
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -u "$(id -u):$(id -g)" \
            -e JOBS=4 \
            libavif-wasm-builder \
            ./scripts/build.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Test in Node
        run: node --test test/node/*.test.mjs

      - name: Verify npm pack contents
        run: node scripts/verify-pack.mjs

      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "git tag v${tag} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack npm tarball and release zip
        run: |
          npm pack
          mkdir -p release
          cp -a dist LICENSE THIRD_PARTY_NOTICES.md licenses versions.env README.md release/
          (cd release && zip -r ../libavif-wasm-${{ github.ref_name }}.zip .)

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            libavif-wasm-${{ github.ref_name }}.zip
            phenomen-libavif-wasm-*.tgz
            dist/decode.wasm
            dist/encode.wasm
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true

# Meson cross file for dav1d → wasm32-emscripten (single-threaded, no asm).
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
nm = 'emnm'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'
exe_wrapper = 'node'

[built-in options]
c_args = ['-O3', '-msimd128', '-matomics', '-mbulk-memory']
c_link_args = ['-msimd128']
default_library = 'static'

[properties]
needs_exe_wrapper = true
# emcc "executables" are JS+wasm; skip Meson's host-run sanity check.
skip_sanity_check = true

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
